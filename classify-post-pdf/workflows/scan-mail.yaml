id: 6b0f3c52-8f1e-4c47-9a3d-2e5b7c1d9f40
name: "@zts/classify-post-pdf/scan-mail"
description: >-
  Read the key details off every scanned letter (PDF) in a directory with
  @zts/classify-post-pdf, loading the OCR model once for the whole
  directory. The run shows one scan step, not progress letter by letter;
  the scan-batch record says how each letter went. A letter that cannot be
  read does not fail the run, but a helper crash part way does, keeping
  what was read. Needs an installed @zts/qianfan-ocr 2026.11.03.1 or later;
  see the extension's README.
tags: {}
inputs:
  type: object
  required:
    - directory
  properties:
    directory:
      type: string
      description: Directory of scanned letters; absolute, or relative to the repository
    fraction:
      type: number
      description: Share of the first page, from the top, to read
      default: 0.25
    ocrBehavior:
      type: string
      description: Name of the installed @zts/qianfan-ocr behavior
      default: qianfan-ocr
jobs:
  # The list is named after the run and scanBatch reads it by that name, so
  # concurrent runs each scan their own directory. A run holds the
  # classify-post-pdf behavior for its whole batch, so another run's
  # listPdfs waits behind it and can time out (see the README).
  - name: list
    description: Find the PDFs to scan
    steps:
      - name: list-pdfs
        task:
          type: behavior
          behaviorType: "@zts/classify-post-pdf"
          behaviorName: classify-post-pdf
          methodName: listPdfs
          globalArgs:
            ocrBehavior: ${{ inputs.ocrBehavior }}
          inputs:
            directory: ${{ inputs.directory }}
            run: ${{ run.id }}
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
  - name: scan
    description: Read every listed letter with one model load
    steps:
      - name: scan-batch
        description: Read the letters
        task:
          type: behavior
          behaviorType: "@zts/classify-post-pdf"
          behaviorName: classify-post-pdf
          methodName: scanBatch
          globalArgs:
            ocrBehavior: ${{ inputs.ocrBehavior }}
          inputs:
            list: ${{ run.id }}
            fraction: ${{ inputs.fraction }}
        dependsOn: []
        weight: 0
        # An unreadable letter is recorded in scan-batch and does not fail
        # the step; a helper crash does, and so does reading none of the
        # letters. An empty directory succeeds.
        allowFailure: false
    dependsOn:
      - job: list
        condition:
          type: succeeded
    weight: 0
version: 1
