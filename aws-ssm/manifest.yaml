manifestVersion: 1
name: "@zts/aws-ssm"
version: "2026.10.26.1"
license: MIT
repository: https://github.com/zts/swamp-extensions
description: >-
  A swamp vault on AWS Systems Manager Parameter Store. Every secret is a
  SecureString parameter, on the Standard tier, named by a prefix (default
  /swamp/) and the secret key. Credentials come from the AWS default chain or a
  named profile; an optional KMS key encrypts the values. get, put and delete
  refuse plaintext String parameters, delete is immediate, and errors never
  carry the value. Supports swamp vault read-secret, put, list-keys and delete.
paths:
  base: manifest
vaults:
  - aws_ssm.ts
additionalFiles:
  - README.md
  - LICENSE.txt
labels:
  - vault
  - aws
  - ssm
  - secrets
